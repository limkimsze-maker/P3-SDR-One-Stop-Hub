name: Add Phonograms Toy Castle to SDR Hub

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/add-phonograms-toy-castle.yml'

permissions:
  contents: write

jobs:
  update-hub:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update SDR Hub
        run: python .github/scripts/add_phonograms_toy_castle.py
      - name: Commit hub update
        run: |
          if git diff --quiet -- index.html; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Add Phonograms Toy Castle tab"
          git push
